name: CDK Deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  id-token: write   # necesario para el login OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
          uses: actions/checkout@v4

      - name: Depurar token OIDC
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          if [ -z "$IDTOKEN" ] || [ "$IDTOKEN" == "null" ]; then
            echo "ERROR: no se pudo obtener el token OIDC (falta el permiso id-token: write)"
            exit 1
          fi
          echo "$IDTOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::287785301135:role/datalake-de-juguete-github-actions-dev
          aws-region: eu-north-1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar CDK CLI
        run: npm install -g aws-cdk

      - name: Instalar dependencias del proyecto CDK
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: cdk deploy
        run: |
          source .venv/bin/activate
          cdk deploy --require-approval never